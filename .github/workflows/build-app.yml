# Builds the desktop app PolySweeper.exe on a Windows machine, tests it there, and publishes it to the
# app-build branch. The owner's autopilot installs it from that branch (app/bin/PolySweeper.exe) and puts
# a PolySweeper shortcut on the desktop. The exe loads the app's code from the project folder, so most
# app changes do not even need a new exe; it is rebuilt anyway when the app or launcher changes.
name: Build PolySweeper.exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/launcher.py
      - app/polysweeper_app.py
      - app/make_icon.py
      - .github/workflows/build-app.yml

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      POLYSWEEPER_NO_ALERTS: "1"     # the build machine must never send phone alerts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tools (build machine only; the app itself uses only Python's standard library)
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: All tests, on Windows
        working-directory: code
        run: |
          git config --global user.name "build"
          git config --global user.email "build@example.invalid"
          python -m unittest discover -s tests

      - name: Build PolySweeper.exe
        run: |
          mkdir app/build -Force | Out-Null
          python app/make_icon.py app/build/icon.ico
          python -m PyInstaller --noconfirm --onefile --windowed --name PolySweeper --icon "$PWD/app/build/icon.ico" --distpath app/bin --workpath app/build/work --specpath app/build app/launcher.py
          Get-Item app/bin/PolySweeper.exe | Format-List Name, Length

      - name: Run shadow mode for 90 seconds (real live data for the self-test)
        working-directory: code
        run: python -m polysweeper.shadow --minutes 1.5

      - name: Self-test the exe on Windows (window open, screenshot, checks)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/selftest | Out-Null
          $env:POLYSWEEPER_SELFTEST_SECONDS = "16"
          $p = Start-Process -FilePath "app\bin\PolySweeper.exe" -ArgumentList "--selftest", "$PWD\app\selftest" -PassThru
          $null = $p.Handle
          Start-Sleep -Seconds 11
          python -c "from PIL import ImageGrab; ImageGrab.grab().save('app/selftest/screen.png')"
          if ($LASTEXITCODE -ne 0) { Write-Host "screenshot not possible on this machine (the self-test still runs)" }
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "the app did not finish its self-test" }
          Get-Content app/selftest/selftest.json
          $r = Get-Content app/selftest/selftest.json | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $r.ok) { throw "self-test failed (exit $($p.ExitCode))" }
          if ($r.trades_shown -lt 1) { throw "no trades shown" }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polysweeper-app
          path: |
            app/bin/PolySweeper.exe
            app/selftest/

      - name: Publish to the app-build branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/app-build"
          mkdir -p "$out"
          cp app/bin/PolySweeper.exe app/selftest/selftest.json "$out/"
          if [ -f app/selftest/screen.png ]; then cp app/selftest/screen.png "$out/"; fi
          cd "$out"
          printf 'PolySweeper.exe built from %s on %s\n' "${GITHUB_SHA::7}" "$(date -u '+%Y-%m-%d %H:%M UTC')" > BUILD.txt
          git init -q -b app-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "PolySweeper.exe built from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" app-build
