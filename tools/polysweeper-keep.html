<title>PolySweeper Keep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: full-screen 3D neon city (canvas) with a HUD on top: status bar, bot stats, selected-tower card, quest log + schedule drawer. Single dark look on purpose (night city). */
:root{
  --night:#07060d; --glass:rgba(12,10,26,.78); --line:#2b2550;
  --text:#e9e6ff; --dim:#9a93c9; --cyan:#29f0ff; --pink:#ff2bd6; --amber:#ffb627; --lime:#7dff6b; --red:#ff4d6d;
  --hud:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono:"Share Tech Mono", ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--night)}
body{color:var(--text);font-family:var(--hud);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;grid-template-rows:auto 1fr auto;gap:12px}
.hud > *{pointer-events:auto;min-width:0}
.box{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:12px 14px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:start}
h1{margin:0;font-size:clamp(20px,4vw,30px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 12px rgba(41,240,255,.6),2px 0 0 var(--pink)}
.tag{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:4px 18px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stats b{display:block;font-size:18px;font-weight:400}
.stats span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.c-lime{color:var(--lime)} .c-amber{color:var(--amber)} .c-cyan{color:var(--cyan)} .c-pink{color:var(--pink)} .c-red{color:var(--red)} .c-dim{color:var(--dim)}
.bottom{display:grid;grid-template-columns:minmax(0,360px) 1fr minmax(0,360px);gap:12px;align-items:end}
#card h2{margin:0 0 2px;font-size:18px;letter-spacing:.04em}
#card .where{font-family:var(--mono);font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.pill{display:inline-block;margin:8px 0 6px;font-family:var(--mono);font-size:12px;padding:3px 8px;border:1px solid currentColor;letter-spacing:.1em}
#card p{margin:4px 0;font-size:15px;line-height:1.4}
#card .next{color:var(--dim);font-family:var(--mono);font-size:13px}
.hint{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:center;align-self:end;padding-bottom:6px}
details{max-height:min(52vh,420px);overflow:auto}
summary{cursor:pointer;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pink);list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";font-family:var(--mono)} details[open] summary::after{content:"–"}
.q{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.q li{border-left:3px solid var(--line);padding:2px 0 2px 9px;font-size:14px;line-height:1.35}
.q li small{display:block;color:var(--dim);font-family:var(--mono);font-size:12px}
.q .live{border-color:var(--lime)} .q .lead{border-color:var(--amber)} .q .park{border-color:var(--cyan)} .q .done{border-color:var(--red)}
.q h3{margin:12px 0 0;font-size:12px;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase}
.t{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.t li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;font-size:14px}
.t time{font-family:var(--mono);color:var(--amber)} .t li.past{opacity:.45} .t li.soon time{color:var(--lime)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (max-width:900px){
  .bottom{grid-template-columns:1fr}
  .hint{display:none}
  .stats{grid-template-columns:repeat(2,auto)}
  details{max-height:34vh}
}
#fallback{position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:var(--dim)}
</style>

<canvas id="scene" aria-label="3D neon city: each tower is one member of the PolySweeper crew"></canvas>
<div id="fallback" hidden>3D is not available in this browser. The status panels below still show everything.</div>

<div class="hud">
  <div class="top">
    <div class="box">
      <h1>PolySweeper Keep</h1>
      <div class="tag">Night City · pretend trades only · data 4 Oct 14:30 · Tunis <span id="clock">--:--</span></div>
    </div>
    <div class="box stats" aria-label="Bot results">
      <div><span>Today</span><b class="c-lime">33W · 0L</b></div>
      <div><span>Today P&amp;L</span><b class="c-amber">+$5.48</b></div>
      <div><span>Since Sep 30</span><b>123W · 4L</b></div>
      <div><span>Feed</span><b class="c-cyan">98% sync</b></div>
    </div>
  </div>
  <div></div>
  <div class="bottom">
    <div class="box" id="card" aria-live="polite"></div>
    <div class="hint">Drag to turn the city · tap a tower</div>
    <div class="box">
      <details id="log">
        <summary>Quest log &amp; schedule</summary>
        <h3 class="q" style="margin:10px 0 0;font-size:12px;color:var(--cyan);letter-spacing:.1em">TONIGHT</h3>
        <ul class="t" id="timeline"></ul>
        <ul class="q" id="quests"></ul>
      </details>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------------- data (snapshot from the project notes) ----------------
const CREW = [
  {id:"sweeper", name:"The Sweeper", where:"Central Spire · your laptop", color:0x29f0ff, h:46, pos:[0,0],
   role:"Shadow mode: watches 24 leagues and makes pretend buys with real prices.",
   deed:"Today 33 wins, 0 losses (+$5.48 pretend). 9 buys waiting for payout. New: baseball, NFL, college football, hockey.", always:true},
  {id:"researcher", name:"The Researcher", where:"Archive Tower", color:0xff2bd6, h:30, pos:[-22,-14],
   role:"Finds new money-making ideas on the web, GitHub and Polymarket data.",
   deed:"Found \"locked lines\": 2,270 of 2,270 settled exactly as the math said.", runs:[[5,17,90]]},
  {id:"redteam", name:"The Red Knight", where:"Arena Block", color:0xff4d6d, h:24, pos:[22,-14],
   role:"Attacks every idea: how could it lose money?",
   deed:"Knocked out crypto \"locked by math\". Parked our own win-chance model.", runs:[[5,17,90]]},
  {id:"tester", name:"The Alchemist", where:"Lab Stack", color:0x7dff6b, h:27, pos:[-24,14],
   role:"Proves ideas on real Polymarket data.",
   deed:"Tonight: live watch of NFL and baseball \"locked lines\".", runs:[[5,17,90],[17,50,45],[21,0,45]]},
  {id:"analyst", name:"The Seer", where:"Signal Tower", color:0xffb627, h:33, pos:[24,14],
   role:"Reads your laptop's pretend trades morning and evening.",
   deed:"Morning: 78 tests pass, data every 3 hours, no new losses.", runs:[[5,17,60],[17,43,30]]},
  {id:"fixer", name:"The Smith", where:"Forge Works", color:0x8f7bff, h:20, pos:[0,-28],
   role:"Health checks and bug fixes, only when something breaks.",
   deed:"Nothing to fix today.", oncall:true},
  {id:"owner", name:"You, the Keeper", where:"Gate Plaza", color:0xeeeeff, h:18, pos:[0,28],
   role:"Decides what the crew does and when real money starts.",
   deed:"Today: approved US sports and the Today report. Both are live.", owner:true}
];
const QUESTS = [
  ["Testing", [["live","Locked lines (#17)","Math held 2,270/2,270. Can we get filled below 0.99? Live watch tonight."],
               ["live","US sports end of game (#14)","Laptop started watching today."],
               ["live","Late band 0.995-0.999 (#6)","Live feed measures what sells after the result."],
               ["live","Tennis practically won (#7)","Score log collecting."]]],
  ["Leads", [["lead","Profitable wallets (#10)","0 losses in 3,856 buys after the end. Best: US sports at 0.99."]]],
  ["Parked", [["park","Own win-chance model (#15)","Even a 4-run 9th-inning lead loses 1 in 300-1,000."]]],
  ["Failed", [["done","Crypto locked by math (#16)","Never truly certain."],["done","Weather dead ranges (#13)","Cleared at 0.999 at once."],
              ["done","YES + NO under $1 (#1)","Impossible: one shared book."],["done","Every option under $1 (#2)","No gaps after fees."],
              ["done","Waiting buy orders","Fill when you are wrong."],["done","Buying on price during play","No edge."]]],
  ["Not started", [["","Gaps, economic releases, maker & holding rewards, faster results","#3 #4 #8 #9 #12"]]]
];
const EVENTS = [[17*60+43,"Health check (the Seer)"],[17*60+50,"NFL: locked-lines watch"],[21*60,"Late NFL + baseball watch"],[1440+5*60+17,"Full research run"],[1440+5*60+40,"First US-sports results"]];

// ---------------- time & status ----------------
function tunisMins(){
  const p = new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Tunis",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  return (+p.find(x=>x.type==="hour").value % 24)*60 + +p.find(x=>x.type==="minute").value;
}
const fmt = m => `${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
function status(a, now){
  if(a.always) return {key:"on", label:"ONLINE 24/7", css:"c-lime", next:"Running on your laptop right now."};
  if(a.owner) return {key:"on", label:"NO DECISION WAITING", css:"c-amber", next:"Next: read tomorrow's results."};
  if(a.oncall) return {key:"call", label:"ON CALL", css:"c-cyan", next:"Wakes only for a real problem."};
  for(const [h,m,len] of a.runs){ const s=h*60+m; if(now>=s && now<s+len) return {key:"on", label:"WORKING", css:"c-lime", next:`On shift until about ${fmt(s+len)}.`}; }
  const starts = a.runs.map(([h,m])=>h*60+m).sort((x,y)=>x-y);
  const nxt = starts.find(s=>s>now) ?? starts[0]+1440, w = nxt-now;
  return {key:"off", label:"OFFLINE", css:"c-dim", next:`Next shift ${fmt(nxt)} (in ${Math.floor(w/60) ? Math.floor(w/60)+" h " : ""}${w%60} min).`};
}

// ---------------- HUD ----------------
let selected = "sweeper";
function showCard(){
  const a = CREW.find(c=>c.id===selected), st = status(a, tunisMins());
  const hex = "#"+a.color.toString(16).padStart(6,"0");
  document.getElementById("card").innerHTML =
    `<h2 style="color:${hex};text-shadow:0 0 10px ${hex}88">${a.name}</h2><div class="where">${a.where}</div>
     <span class="pill ${st.css}">${st.label}</span><p>${a.deed}</p><p class="c-dim">${a.role}</p><p class="next">${st.next}</p>`;
}
function renderHud(){
  const now = tunisMins();
  document.getElementById("clock").textContent = fmt(now);
  document.getElementById("timeline").innerHTML = EVENTS.map(([t,txt])=>{
    const cls = t<now ? "past" : t-now<=60 ? "soon" : "";
    return `<li class="${cls}"><time>${t>=1440?"+1d "+fmt(t-1440):fmt(t)}</time><span>${txt}</span></li>`;}).join("");
  showCard();
}
document.getElementById("quests").innerHTML = QUESTS.map(([g,items])=>`<h3>${g}</h3>`+items.map(([c,n,s])=>`<li class="${c}">${n}<small>${s}</small></li>`).join("")).join("");
try{ if(window.innerWidth>900) document.getElementById("log").open = true; }catch(e){}
renderHud(); setInterval(()=>{ renderHud(); updateStatus(); }, 30000);

// ---------------- 3D city ----------------
let updateStatus = ()=>{};
(function(){
  const canvas = document.getElementById("scene");
  if(!window.THREE){ document.getElementById("fallback").hidden=false; return; }
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas, antialias:true}); }catch(e){ document.getElementById("fallback").hidden=false; return; }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const small = Math.min(innerWidth, innerHeight) < 700;
  renderer.setPixelRatio(Math.min(devicePixelRatio, small ? 1.5 : 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07060d);
  scene.fog = new THREE.FogExp2(0x0b0820, 0.0105);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 600);

  scene.add(new THREE.HemisphereLight(0x5a4bff, 0x0a0614, 0.55));
  const moon = new THREE.DirectionalLight(0x8fa8ff, 0.35); moon.position.set(-40,80,30); scene.add(moon);

  // wet street + neon grid
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400,400), new THREE.MeshStandardMaterial({color:0x0a0916, roughness:.25, metalness:.8}));
  ground.rotation.x = -Math.PI/2; scene.add(ground);
  const grid = new THREE.GridHelper(400, 80, 0xff2bd6, 0x1e1a48); grid.position.y = .02; grid.material.transparent = true; grid.material.opacity = .35; scene.add(grid);

  // window texture
  function windowsTex(tint){
    const c = document.createElement("canvas"); c.width = 64; c.height = 128; const x = c.getContext("2d");
    x.fillStyle = "#0b0a18"; x.fillRect(0,0,64,128);
    for(let r=0;r<32;r++) for(let k=0;k<8;k++){
      const on = Math.random() < .38; if(!on) continue;
      x.fillStyle = Math.random()<.2 ? tint : (Math.random()<.5 ? "#ffd27a" : "#9fd8ff");
      x.globalAlpha = .35 + Math.random()*.65; x.fillRect(k*8+2, r*4+1, 4, 2);
    }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.NearestFilter; return t;
  }
  const filler = [windowsTex("#ff2bd6"), windowsTex("#29f0ff"), windowsTex("#ffb627")];

  // background skyline
  const n = small ? 120 : 220;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, r = 42 + Math.random()*130;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const w = 4+Math.random()*7, d = 4+Math.random()*7, h = 6 + Math.random()*Math.random()*70;
    const tex = filler[i%3].clone(); tex.needsUpdate = true; tex.repeat.set(Math.max(1,w/6), Math.max(1,h/12));
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color:0x14122a, emissive:0xffffff, emissiveMap:tex, emissiveIntensity:.55, roughness:.6}));
    m.position.set(x, h/2, z); scene.add(m);
    if(Math.random()<.18){ // rooftop neon strip
      const col = [0xff2bd6,0x29f0ff,0xffb627][i%3];
      const s = new THREE.Mesh(new THREE.BoxGeometry(w*1.02,.4,d*1.02), new THREE.MeshBasicMaterial({color:col}));
      s.position.set(x, h+.2, z); scene.add(s);
    }
  }

  // sign texture (name + status), redrawn when status changes
  function signCanvas(){ const c=document.createElement("canvas"); c.width=512; c.height=160; return c; }
  function paintSign(c, a, st){
    const x = c.getContext("2d"), hex = "#"+a.color.toString(16).padStart(6,"0");
    x.clearRect(0,0,512,160);
    x.fillStyle = "rgba(8,6,20,.82)"; x.fillRect(8,8,496,144);
    x.strokeStyle = st.key==="off" ? "#4a4470" : hex; x.lineWidth = 6; x.strokeRect(8,8,496,144);
    x.shadowColor = hex; x.shadowBlur = st.key==="off" ? 0 : 22;
    x.fillStyle = st.key==="off" ? "#8b84b8" : hex; x.font = "700 52px 'Chakra Petch', sans-serif"; x.textAlign="center";
    x.fillText(a.name.toUpperCase(), 256, 72);
    x.shadowBlur = 0; x.font = "34px 'Share Tech Mono', monospace";
    x.fillStyle = st.key==="on" ? "#7dff6b" : st.key==="call" ? "#29f0ff" : "#8b84b8";
    x.fillText(st.label, 256, 124);
  }

  // crew towers
  const towers = [], pickables = [];
  CREW.forEach(a=>{
    const g = new THREE.Group(); g.position.set(a.pos[0], 0, a.pos[1]);
    const w = a.id==="sweeper" ? 9 : 7;
    const tex = windowsTex("#"+a.color.toString(16).padStart(6,"0")); tex.repeat.set(1.4, a.h/10);
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, a.h, w), new THREE.MeshStandardMaterial({color:0x17143a, emissive:0xffffff, emissiveMap:tex, emissiveIntensity:.8, roughness:.35, metalness:.5}));
    body.position.y = a.h/2; body.userData.id = a.id; g.add(body); pickables.push(body);
    // neon edges
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry), new THREE.LineBasicMaterial({color:a.color}));
    edges.position.copy(body.position); g.add(edges);
    // crown ring
    const ring = new THREE.Mesh(new THREE.TorusGeometry(w*.75, .25, 8, 48), new THREE.MeshBasicMaterial({color:a.color}));
    ring.rotation.x = Math.PI/2; ring.position.y = a.h + 2; g.add(ring);
    // beacon light
    const light = new THREE.PointLight(a.color, 1.4, 40, 2); light.position.y = a.h + 3; g.add(light);
    // sign
    const sc = signCanvas(); const stex = new THREE.CanvasTexture(sc);
    const sign = new THREE.Sprite(new THREE.SpriteMaterial({map:stex, transparent:true, depthWrite:false}));
    sign.scale.set(16, 5, 1); sign.position.y = a.h + 7; g.add(sign);
    scene.add(g);
    towers.push({a, g, body, edges, ring, light, sc, stex, w});
  });
  // sweeper spire antenna
  const sw = towers[0];
  const spire = new THREE.Mesh(new THREE.ConeGeometry(1.2, 14, 6), new THREE.MeshBasicMaterial({color:0x29f0ff, wireframe:true}));
  spire.position.y = sw.a.h + 9; sw.g.add(spire);

  updateStatus = function(){
    const now = tunisMins();
    towers.forEach(t=>{
      const st = status(t.a, now); t.st = st;
      paintSign(t.sc, t.a, st); t.stex.needsUpdate = true;
      const on = st.key !== "off";
      t.edges.material.opacity = on ? 1 : .25; t.edges.material.transparent = true;
      t.ring.visible = on; t.light.intensity = on ? 1.4 : .15;
      t.body.material.emissiveIntensity = on ? .85 : .25;
    });
  };
  updateStatus();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(updateStatus);

  // flying cars
  const cars = [];
  for(let i=0;i<(small?10:18);i++){
    const col = [0xff2bd6,0x29f0ff,0xffb627,0x7dff6b][i%4];
    const car = new THREE.Mesh(new THREE.BoxGeometry(1.6,.5,.8), new THREE.MeshBasicMaterial({color:col}));
    car.userData = {r: 30+Math.random()*60, y: 14+Math.random()*30, s:(.08+Math.random()*.14)*(Math.random()<.5?-1:1), a:Math.random()*Math.PI*2};
    scene.add(car); cars.push(car);
  }

  // rain
  const drops = small ? 900 : 1800, rp = new Float32Array(drops*6);
  for(let i=0;i<drops;i++){ const x=(Math.random()-.5)*180, y=Math.random()*90, z=(Math.random()-.5)*180;
    rp.set([x,y,z,x+.15,y-1.6,z], i*6); }
  const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute("position", new THREE.BufferAttribute(rp,3));
  const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({color:0x6f7cff, transparent:true, opacity:.35}));
  scene.add(rain);

  // camera orbit (drag) + tap to select
  let theta = .7, phi = 1.05, radius = small ? 112 : 95, auto = !reduce, dragging = false, moved = 0, lx=0, ly=0;
  const target = new THREE.Vector3(0, 14, 0);
  canvas.addEventListener("pointerdown", e=>{ dragging=true; moved=0; lx=e.clientX; ly=e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", e=>{ if(!dragging) return; const dx=e.clientX-lx, dy=e.clientY-ly; moved+=Math.abs(dx)+Math.abs(dy);
    theta -= dx*.006; phi = Math.min(1.42, Math.max(.35, phi - dy*.004)); lx=e.clientX; ly=e.clientY; auto=false; });
  canvas.addEventListener("pointerup", e=>{ dragging=false; if(moved<6) pick(e); setTimeout(()=>{ if(!dragging && !reduce) auto=true; }, 6000); });
  canvas.addEventListener("wheel", e=>{ e.preventDefault(); radius = Math.min(170, Math.max(45, radius + e.deltaY*.06)); }, {passive:false});
  const ray = new THREE.Raycaster(), mv = new THREE.Vector2();
  function pick(e){
    const r = canvas.getBoundingClientRect(); mv.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(mv, camera); const hit = ray.intersectObjects(pickables)[0];
    if(hit){ selected = hit.object.userData.id; showCard(); }
  }

  function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  addEventListener("resize", resize); resize();

  const clock = new THREE.Clock();
  function frame(){
    const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
    if(auto) theta += dt*.05;
    camera.position.set(target.x + radius*Math.sin(phi)*Math.cos(theta), target.y + radius*Math.cos(phi), target.z + radius*Math.sin(phi)*Math.sin(theta));
    camera.lookAt(target);
    if(!reduce){
      towers.forEach((tw,i)=>{ tw.ring.rotation.z = t*(.4+i*.07); if(tw.st && tw.st.key!=="off") tw.light.intensity = 1.1 + Math.sin(t*3+i)*.4; });
      spire.rotation.y = t*.8;
      cars.forEach(c=>{ const u=c.userData; u.a += u.s*dt; c.position.set(Math.cos(u.a)*u.r, u.y + Math.sin(t+u.r)*.6, Math.sin(u.a)*u.r); c.rotation.y = -u.a + (u.s>0?Math.PI/2:-Math.PI/2); });
      const p = rain.geometry.attributes.position.array;
      for(let i=0;i<drops;i++){ const k=i*6; let y=p[k+1]-dt*60; if(y<0) y+=90; p[k+1]=y; p[k+4]=y-1.6; }
      rain.geometry.attributes.position.needsUpdate = true;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
